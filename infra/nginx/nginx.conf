# Reverse proxy: TLS termination + routing for convozy.orincore.com.
# Point convozy.orincore.com's DNS (CNAME/A record) at this VPS, then get
# certs (e.g. via certbot) before using this in production — see
# infra/scripts/deploy.sh and TRACKER.md Phase 9.

upstream api_upstream {
    server api:3000;
}

upstream web_upstream {
    server web:3001;
}

server {
    listen 80;
    server_name convozy.orincore.com;

    # Uncomment once TLS is configured, to force HTTPS in production:
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Meta webhooks must get a fast response — keep timeouts tight.
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers (defense in depth alongside helmet() in the API —
    # CLAUDE.md §5a A05).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
